<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Preview</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    </style>
</head>
<body class="font-sans antialiased bg-slate-200/70 text-slate-800 min-h-screen">

    <!-- Standalone Preview Top Bar -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-lg border-b border-slate-700">
        <div class="px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shrink-0">
                    <i class="fa-solid fa-globe text-sm"></i>
                </div>
                <div class="min-w-0">
                    <h1 id="previewPageTitle" class="font-bold text-sm truncate">Template Preview</h1>
                    <p id="previewPageCategory" class="text-[11px] text-slate-400 truncate">Standalone preview</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Device switcher -->
                <div class="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700 space-x-1">
                    <button onclick="setDevice('desktop')" id="devBtn-desktop" class="px-3 py-1 text-xs rounded-md bg-blue-600 text-white font-medium flex items-center space-x-1.5 transition">
                        <i class="fa-solid fa-desktop text-xs"></i><span>Desktop</span>
                    </button>
                    <button onclick="setDevice('tablet')" id="devBtn-tablet" class="px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium flex items-center space-x-1.5 transition">
                        <i class="fa-solid fa-tablet-screen-button text-xs"></i><span>Tablet</span>
                    </button>
                    <button onclick="setDevice('mobile')" id="devBtn-mobile" class="px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium flex items-center space-x-1.5 transition">
                        <i class="fa-solid fa-mobile-screen-button text-xs"></i><span>Mobile</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Preview Body -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8 flex justify-center items-start">
        <div id="previewFrame" class="bg-white rounded-lg shadow-2xl border border-slate-300 overflow-hidden flex flex-col transition-all duration-300 my-4 w-full" style="max-width: 720px;">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <script>
        // ---- Read template from query param ----
        let template = null;
        try {
            const raw = new URLSearchParams(window.location.search).get('template');
            if (raw) {
                template = JSON.parse(decodeURIComponent(raw));
            }
        } catch (e) {
            template = null;
        }

        if (!template) {
            document.getElementById('previewFrame').innerHTML = `
                <div class="p-12 text-center">
                    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-2xl mx-auto mb-3 border border-slate-200">
                        <i class="fa-solid fa-circle-exclamation"></i>
                    </div>
                    <h4 class="text-sm font-semibold text-slate-800">Template not found</h4>
                    <p class="text-xs text-slate-500 mt-1">No template data was passed to this preview.</p>
                    <button onclick="window.close()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-medium rounded-md hover:bg-blue-500">
                        Close
                    </button>
                </div>`;
        } else {
            document.getElementById('previewPageTitle').innerText = template.title;
            document.getElementById('previewPageCategory').innerText = template.category + ' \u2022 Color Tag: ' + template.color;
            renderPreview();
        }

        // ---- Device switcher ----
        let currentDevice = 'desktop';
        function setDevice(device) {
            currentDevice = device;
            ['desktop', 'tablet', 'mobile'].forEach((d) => {
                const btn = document.getElementById('devBtn-' + d);
                if (d === device) {
                    btn.className = 'px-3 py-1 text-xs rounded-md bg-blue-600 text-white font-medium flex items-center space-x-1.5 transition shadow';
                } else {
                    btn.className = 'px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium flex items-center space-x-1.5 transition';
                }
            });
            const frame = document.getElementById('previewFrame');
            if (device === 'mobile') frame.style.maxWidth = '375px';
            else if (device === 'tablet') frame.style.maxWidth = '640px';
            else frame.style.maxWidth = '720px';
        }

        // ---- Field renderer matching template field types ----
        function renderField(f) {
            const baseInput = 'w-full border border-slate-300 rounded px-3 py-2 text-xs bg-white text-slate-700 focus:outline-none focus:border-blue-500';
            const label = '<label class="block text-xs font-medium text-slate-700 mb-1">' + f.label + (f.required ? ' <span class="text-rose-500">*</span>' : '') + '</label>';
            const placeholder = f.placeholder || ('Enter ' + f.label.toLowerCase() + '...');

            switch (f.type) {
                case 'textarea':
                    return '<div class="mb-3">' + label + '<textarea rows="3" placeholder="' + placeholder + '" class="' + baseInput + ' resize-none"></textarea></div>';
                case 'single_dropdown':
                case 'multi_dropdown':
                    return '<div class="mb-3">' + label + '<select class="' + baseInput + '"><option>' + (f.placeholder || 'Select an option') + '</option><option>Option 1</option><option>Option 2</option></select></div>';
                case 'checkbox':
                    return '<div class="mb-3 flex items-center space-x-2"><input type="checkbox" class="rounded border-slate-300" /><span class="text-xs text-slate-600">' + f.label + '</span></div>';
                case 'date':
                case 'phone':
                case 'email':
                case 'number':
                    return '<div class="mb-3">' + label + '<input type="text" placeholder="' + placeholder + '" class="' + baseInput + '" /></div>';
                case 'button':
                    return '<button class="w-full py-2.5 mt-2 ' + (template.accentColor || 'bg-blue-600') + ' text-white font-bold text-xs rounded shadow uppercase">' + f.label + '</button>';
                default:
                    return '<div class="mb-3">' + label + '<input type="text" placeholder="' + placeholder + '" class="' + baseInput + '" /></div>';
            }
        }

        function renderPreview() {
            const frame = document.getElementById('previewFrame');
            const fieldsHtml = (template.elements || []).map(renderField).join('');

            frame.innerHTML = `
                <div class="w-full h-40 relative flex items-center justify-center text-white text-center p-4" style="background-color:${template.colorHex};">
                    <img src="${template.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                         alt="${template.headerText}" class="absolute inset-0 w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-black/40"></div>
                    <div class="hidden absolute inset-0 items-center justify-center" style="background:linear-gradient(120deg, ${template.colorHex}, #0f172a);">
                        <span class="text-[11px] font-semibold uppercase tracking-wider px-4 text-center">${template.headerText}</span>
                    </div>
                    <h4 class="relative z-10 font-bold text-lg uppercase tracking-wide px-4">${template.headerText}</h4>
                </div>
                <div class="p-6 space-y-3 flex-1">
                    <p class="text-xs text-slate-500">Please fill out the form below to get started immediately.</p>
                    ${fieldsHtml}
                    <button onclick="submitPreview()" class="w-full py-2.5 mt-2 ${template.accentColor || 'bg-blue-600'} text-white font-bold text-xs rounded shadow uppercase">Submit Information</button>
                </div>
            `;
        }

        function submitPreview() {
            alert('Template imported successfully! Close this preview and use the template in the app to edit it.');
        }
    </script>
</body>
</html>
