<script type="text/javascript">
  function getSectionAll(str) {


    if (str == "")
      alert("Please select any Class");
    else
      var ajx; // The variable that makes Ajax possible!

    if (window.XMLHttpRequest)
      ajx = new XMLHttpRequest();
    ajx.onreadystatechange = function() {

      if (ajx.readyState == 4) {
        //alert(ajx.responseText); 
        document.getElementById("txt_section").innerHTML = ajx.responseText;
      }
    }
    ajx.open("GET", "get_section_all.php?class_id=" + str);
    ajx.send();

  }



  function calculate_totalAmount(stdID) {
    var baseEl = document.getElementById("base_amount_" + stdID);
    var base = baseEl ? (parseFloat(baseEl.value) || 0) : 0;

    var otherInputs = document.querySelectorAll('input[name^="otherFee[' + stdID + ']"]');
    var Othernet = 0;
    for (var i = 0; i < otherInputs.length; i++) {
      Othernet += parseFloat(otherInputs[i].value) || 0;
    }

    var totalEl = document.getElementById("total" + stdID);
    if (totalEl) totalEl.value = base + Othernet;
  }

  function ShowFeeParameters() {


    var display = document.getElementById("others_fee").style.display;

    var btn = document.getElementById("other_btn");

    if (display == "block") {
      document.getElementById("others_fee").style.display = "none";
      btn.value = "+ Fee";
      btn.classList.remove("btn-danger");
      btn.classList.add("btn-success");
    } else {
      document.getElementById("others_fee").style.display = "block";
      btn.value = "- Fee";
      btn.classList.remove("btn-success");
      btn.classList.add("btn-danger");

    }

  }

  function getClassesByHead(headId) {
    var url = "get_classes_by_head.php?head_id=";
    if (headId !== "" && headId !== null && headId !== "All") {
      url += headId;
    }
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (xhr.readyState == 4 && xhr.status == 200) {
        var classEl = document.getElementById("class_id");
        if (classEl) classEl.innerHTML = xhr.responseText;
        var secEl = document.getElementById("txt_section");
        if (secEl) secEl.innerHTML = '<option value="All">All</option>';
      }
    };
    xhr.open("GET", url, true);
    xhr.send();
  }

  window.addEventListener('DOMContentLoaded', function() {
    var headSel = document.getElementById("class_head");
    if (headSel && headSel.value !== "") {
      getClassesByHead(headSel.value);
    }
  });
