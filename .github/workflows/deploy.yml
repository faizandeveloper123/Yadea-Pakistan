name: Deploy to Contabo XAMPP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 169.58.191.84 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r dist/. /tmp/site/
          cp logo.svg /tmp/site/ 2>/dev/null || true
          cp -r api /tmp/site/api
          tar -czf /tmp/site.tar.gz -C /tmp/site .
          scp -q -i ~/.ssh/id_ed25519 /tmp/site.tar.gz root@169.58.191.84:/tmp/site.tar.gz
          ssh -i ~/.ssh/id_ed25519 root@169.58.191.84 "rm -rf /opt/lampp/htdocs/Evee && mkdir -p /opt/lampp/htdocs/Evee && tar -xzf /tmp/site.tar.gz -C /opt/lampp/htdocs/Evee && chown -R root:root /opt/lampp/htdocs/Evee && echo DEPLOY_OK"
