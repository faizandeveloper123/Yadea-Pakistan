name: Deploy to Contabo XAMPP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Write SMTP secrets (api/mail_secrets.php)
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_PASS" ]; then
            printf '<?php\ndefine(%s, %s);\n' "'SMTP_PASS'" "'$SMTP_PASS'" > api/mail_secrets.php
            echo "mail_secrets.php written (password hidden)"
          else
            echo "SMTP_PASS secret not set - emails will fail until it is added"
          fi

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Write key from secret, strip all \r and trailing whitespace
          printf '%s' "$SSH_KEY" | tr -d '\r\n' > ~/.ssh/deploy_key
          # Re-add newlines at proper positions (every 76 chars won't work for SSH, just keep as-is for OpenSSH format)
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verify key fingerprint
          ssh-keygen -l -f ~/.ssh/deploy_key || { echo "ERROR: SSH key is invalid"; exit 1; }

          ssh-keyscan -H 169.58.191.84 >> ~/.ssh/known_hosts 2>/dev/null

          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r dist/. /tmp/site/
          cp logo.svg /tmp/site/ 2>/dev/null || true
          cp -r api /tmp/site/api
          tar -czf /tmp/site.tar.gz -C /tmp/site .

          scp -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key /tmp/site.tar.gz root@169.58.191.84:/tmp/site.tar.gz
          ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key root@169.58.191.84 "rm -rf /opt/lampp/htdocs/Yadea && mkdir -p /opt/lampp/htdocs/Yadea && tar -xzf /tmp/site.tar.gz -C /opt/lampp/htdocs/Yadea && chown -R root:root /opt/lampp/htdocs/Yadea && echo DEPLOY_OK"
