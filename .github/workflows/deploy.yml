name: Deploy to yadea.biztrack.uk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Write SMTP secrets
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_PASS" ]; then
            printf "<?php\ndefine('SMTP_PASS', '%s');\n" "$SMTP_PASS" > api/mail_secrets.php
          fi

      - name: Deploy to server
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key

          ssh-keyscan -H 81.17.101.93 >> ~/.ssh/known_hosts 2>/dev/null

          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r dist/* /tmp/site/
          cp logo.svg /tmp/site/ 2>/dev/null || true
          cp -r api /tmp/site/api
          tar -czf /tmp/site.tar.gz -C /tmp/site .

          scp -i ~/.ssh/deploy_key /tmp/site.tar.gz root@81.17.101.93:/tmp/site.tar.gz
          ssh -i ~/.ssh/deploy_key root@81.17.101.93 '
            rm -rf /var/www/yadea
            mkdir -p /var/www/yadea
            tar -xzf /tmp/site.tar.gz -C /var/www/yadea
            rm /tmp/site.tar.gz
            echo DEPLOY_OK
          '
