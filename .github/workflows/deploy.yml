name: Deploy to Contabo Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload to Contabo
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.Yadea_Pakistan_Access_Key }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.Yadea_Pakistan_Secret_Key }}
          AWS_ENDPOINT_URL: ${{ secrets.Yadea_Pakistan_Endpoint }}
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r dist/. /tmp/site/
          cp logo.svg /tmp/site/ 2>/dev/null || true
          cp -r api /tmp/site/api
          aws s3 sync /tmp/site s3://eveebike --endpoint-url "$AWS_ENDPOINT_URL" --delete
